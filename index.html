<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="알고리즘을 눈앞에, 코드의 흐름을 한눈에. 알고리줌(ALGORI·ZOOM)" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="application-name" content="알고리줌" />
  <meta name="apple-mobile-web-app-title" content="알고리줌" />
  <title>알고리줌</title>
  <link rel="icon" type="image/svg+xml" href="assets/algorizoom-logo.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="assets/theme.css" />
  <link rel="stylesheet" href="assets/home.css" />
</head>
<body>
  <main class="lab-shell">
    <header class="lab-hero">
      <div class="hero-brand">
        <img class="brand-logo" src="assets/algorizoom-logo.svg" alt="" aria-hidden="true" />
        <h1>알고리줌</h1>
        <span class="eyebrow" aria-hidden="true">ALGORI·ZOOM</span>
      </div>
      <p class="hero-tagline">알고리즘을 눈앞에, 코드의 흐름을 한눈에.</p>
      <p class="hero-copy">
        <strong>See how code runs.</strong>
        <span>공부하면서 만난 알고리즘과 Python 코드를 한 단계씩 재생해보세요. 코드가 움직이는 과정을 직접 확인할 수 있습니다.</span>
      </p>
    </header>

    <section class="toolbar" aria-label="시각화 검색">
      <div class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="문제명, 개념, SWEA 번호 검색" autocomplete="off" />
      </div>
    </section>

    <section class="catalog-section">
      <div class="section-head">
        <div>
          <span>LIBRARY</span>
          <h2>시각화 선택</h2>
        </div>
      </div>
      <div id="visualGrid" class="visual-grid"></div>
      <div id="emptyState" class="empty-state" hidden>조건에 맞는 시각화가 없습니다.</div>
    </section>
  </main>

  <script src="assets/visualizer-core.js"></script>
  <script src="assets/catalog.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
